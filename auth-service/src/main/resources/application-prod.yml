# Production profile — containers and hardened deployments.
# Minimal Actuator surface, Swagger off by default, SQL logging off.

server:
  port: ${AUTH_SERVICE_PORT}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048
  forward-headers-strategy: native
spring:
  application:
    name: auth-service
  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:20}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:5}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}
      uri: ${CONFIG_SERVER_URI:http://config-server:8888}
      fail-fast: false
      retry:
        max-attempts: 3
        initial-interval: 1000
        multiplier: 1.5
grpc:
  client:
    user-service:
      host: ${GRPC_CLIENT_USER_SERVICE_HOST:user-service}
      port: ${GRPC_CLIENT_USER_SERVICE_PORT:9090}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    try-it-out-enabled: false
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-minutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}
  issuer: ${JWT_ISSUER:drugstore-prod}
app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:drugstore:auth:}
  rate-limit:
    global:
      enabled: true
      maxRequests: ${RATE_LIMIT_GLOBAL_MAX:5000}
      durationHours: 1
    profiles:
      standard:
        maxRequests: ${RATE_LIMIT_STANDARD:40}
        durationSeconds: 60
      sensitive:
        maxRequests: ${RATE_LIMIT_SENSITIVE:7}
        durationSeconds: 60
      public:
        maxRequests: ${RATE_LIMIT_PUBLIC:100}
        durationSeconds: 60
      admin:
        maxRequests: ${RATE_LIMIT_ADMIN:50}
        durationSeconds: 1
      customer-write:
        maxRequests: ${RATE_LIMIT_CUSTOMER_WRITE:20}
        durationSeconds: 60
      customer-read:
        maxRequests: ${RATE_LIMIT_CUSTOMER_READ:100}
        durationSeconds: 60
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n'
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    io.github.alexisTrejo11.drugstore: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:WARN}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    libs_kernel.log.audit: ${LOG_LEVEL_AUDIT:INFO}
    microservice.auth: ${LOG_LEVEL_APP:INFO}
    org.springframework.boot.autoconfigure: ${LOG_LEVEL_SPRING_BOOT:WARN}
audit:
  log:
    enabled: true
    excluded-endpoints: /actuator/health, /actuator/info, /actuator/metrics, /actuator/prometheus
    detailed: ${AUDIT_DETAILED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:never}
      probes:
        enabled: true
      show-components: never
    env:
      enabled: false
    loggers:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: auth-service
      environment: production
  info:
    env:
      enabled: false
