# Product Service CI — build, test, publish to GHCR.
name: Product Service CI

on:
  push:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "product-service/**"
      - ".github/workflows/product-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: product-service
      enable_publish: true
