# Inventory Service CI — build, test, publish to GHCR.
name: Inventory Service CI

on:
  push:
    branches:
      - main
    paths:
      - "inventory-service/**"
      - ".github/workflows/inventory-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "inventory-service/**"
      - ".github/workflows/inventory-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: inventory-service
      enable_publish: true
