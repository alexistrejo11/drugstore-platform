# Common configuration shared by every environment.
# Select the environment with SPRING_PROFILES_ACTIVE=dev|prod (defaults to dev).
# Profile files only add/override environment-specific behaviour.

server:
  port: ${ADDRESS_SERVICE_PORT:8080}
  forward-headers-strategy: native

spring:
  profiles:
    default: dev
  application:
    name: address-service
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/address_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8
    table: flyway_schema_history
    clean-disabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-minutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}
  issuer: ${JWT_ISSUER:drugstore-api}

app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:drugstore:address:}
  rate-limit:
    global:
      enabled: true
      maxRequests: 5000
      durationHours: 1
    profiles:
      standard:
        maxRequests: 40
        durationSeconds: 60
      sensitive:
        maxRequests: 7
        durationSeconds: 60
      public:
        maxRequests: 100
        durationSeconds: 60
      admin:
        maxRequests: 50
        durationSeconds: 1
      customer-write:
        maxRequests: 20
        durationSeconds: 60
      customer-read:
        maxRequests: 100
        durationSeconds: 60

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

audit:
  log:
    enabled: true
    excluded-endpoints: /actuator/health, /actuator/info, /actuator/metrics, /actuator/prometheus

management:
  endpoints:
    web:
      base-path: /actuator
  metrics:
    tags:
      application: ${spring.application.name}
